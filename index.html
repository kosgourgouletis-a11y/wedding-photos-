<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Κωνσταντίνος & Βασιλική</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbfaf7;color:#24211f;font-family:Georgia,"Times New Roman",serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px;text-align:center}
.photo{width:100%;height:auto;display:block;border-radius:18px}
h1{font-size:27px;font-weight:500;margin:20px 0 7px}
p{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;color:#6f6963;margin:0 auto 21px;max-width:390px}
.upload{display:inline-block;background:#24211f;color:white;padding:14px 24px;border-radius:999px;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
input{display:none}
.small{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#9b958f;margin-top:12px}
</style>
</head>
<body>
<main>
  <img class="photo" src="assets/couple.jpg" alt="Κωνσταντίνος & Βασιλική">
  <h1>Κωνσταντίνος & Βασιλική</h1>
  <p>Τράβηξες μια όμορφη φωτογραφία; Μοιράσου την μαζί μας ❤️</p>
  <label class="upload" for="photos">📸 Επιλέξτε φωτογραφίες</label>
  <input id="photos" type="file" accept="image/*" multiple>
  <div class="small">Οι φωτογραφίες σας θα προστεθούν στις αναμνήσεις της ημέρας μας.</div>
</main>
</body>
</html>
